name: SL morning agent

on:
  schedule:
    # GitHub delays on-the-hour crons badly (04:00/05:00 UTC are the most
    # congested slots), so trigger at off-peak minutes shortly before 06:00
    # Stockholm time and let the script sleep until exactly 06:00. The :10
    # crons are backups (~06:10 local) in case the first never starts.
    # Summer (CEST): 03:35 UTC = 05:35 local, backup 04:10 UTC = 06:10 local.
    # Winter (CET):  04:35 UTC = 05:35 local, backup 05:10 UTC = 06:10 local.
    # The script's --guard-0600 flag skips triggers outside 05:25–07:00 local,
    # and the issue step deduplicates, so the report is sent exactly once.
    - cron: "35 3 * * *"
    - cron: "10 4 * * *"
    - cron: "35 4 * * *"
    - cron: "10 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  morning-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate report
        id: report
        env:
          # Optional: add this repo secret to get live Google Maps walking
          # times in the report. Without it, fixed measured values are used.
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set +e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 morning-agent/sl_morning_agent.py > report.md
          else
            python3 morning-agent/sl_morning_agent.py --guard-0600 > report.md
          fi
          status=$?
          if [ "$status" = "78" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Post report as issue
        if: steps.report.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # Deduplicate: if today's report already exists (e.g. the backup
          # trigger ran after the main one), scheduled runs do nothing.
          TITLE="🚆 SL morning report $(TZ=Europe/Stockholm date +%F)"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            count=$(gh issue list --repo "${{ github.repository }}" \
              --search "\"$TITLE\" in:title" --state all --json number --jq 'length')
            if [ "$count" != "0" ]; then
              echo "Today's report already posted — skipping."
              exit 0
            fi
          fi
          # Close older reports so only today's stays open.
          gh issue list --repo "${{ github.repository }}" \
            --search "SL morning report in:title" --state open \
            --json number --jq '.[].number' | while read -r n; do
              gh issue close "$n" --repo "${{ github.repository }}" || true
            done
          # The @mention + assignee makes GitHub send the report by email
          # (participating notifications are emailed by default).
          printf '\n\ncc @%s\n' "$OWNER" >> report.md
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --assignee "$OWNER" \
            --body-file report.md
