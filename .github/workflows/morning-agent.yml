name: SL morning agent

on:
  schedule:
    # 06:00 Europe/Stockholm is 04:00 UTC in summer (CEST) and 05:00 UTC in
    # winter (CET). Both triggers run; the script's --guard-0600 flag makes
    # the wrong one exit early, so the report is produced exactly once a day.
    - cron: "0 4 * * *"
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  morning-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate report
        id: report
        run: |
          set +e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 morning-agent/sl_morning_agent.py > report.md
          else
            python3 morning-agent/sl_morning_agent.py --guard-0600 > report.md
          fi
          status=$?
          if [ "$status" = "78" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Post report as issue
        if: steps.report.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "🚆 SL morning report $(TZ=Europe/Stockholm date +%F)" \
            --body-file report.md
