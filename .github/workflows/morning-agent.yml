name: SL morning agent

# ---------------------------------------------------------------------------
# 06:00-sharp delivery comes from an EXTERNAL minute-accurate trigger
# (e.g. cron-job.org) that calls the GitHub "repository_dispatch" API at
# 06:00 Europe/Stockholm on weekdays. Dispatch events start within seconds,
# unlike `schedule` events which GitHub delays by 40 min–6 h on this repo
# (measured). See morning-agent/README.md → "Reliable 06:00 delivery".
#
# The `schedule` crons below are a WEEKDAY-ONLY SAFETY NET: if the external
# trigger ever fails, a (late, clearly-marked) backup email still goes out
# rather than nothing. Dedup makes sure you never get two.
# ---------------------------------------------------------------------------
on:
  repository_dispatch:
    types: [morning-run]        # primary, on-time path (external scheduler)
  workflow_dispatch: {}          # manual testing (any day, bypasses gates)
  schedule:
    - cron: "10 4 * * 1-5"       # ~06:10 local (summer) — backup
    - cron: "10 5 * * 1-5"       # ~06:10 local (winter) — backup
    - cron: "0 8 * * 1-5"        # last-ditch mid-morning backup

permissions:
  contents: read
  issues: write

# Serialise runs so the external trigger and a backup can never double-send:
# a second run waits for the first to finish, then its dedup gate sees the
# already-created issue and skips.
concurrency:
  group: morning-agent
  cancel-in-progress: false

jobs:
  morning-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gate (weekday + dedup)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DOW=$(TZ=Europe/Stockholm date +%u)            # 1=Mon … 7=Sun
          TITLE="🚆 SL morning report $(TZ=Europe/Stockholm date +%F)"
          echo "REPORT_TITLE=$TITLE" >> "$GITHUB_ENV"
          # Manual runs always proceed (for testing on any day).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Automatic paths: weekdays only.
          if [ "$DOW" -gt 5 ]; then
            echo "Weekend — skipping."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Dedup: skip if today's report already went out.
          n=$(gh issue list --repo "${{ github.repository }}" \
                --search "\"$TITLE\" in:title" --state all --json number --jq 'length')
          if [ "$n" != "0" ]; then
            echo "Already sent today — skipping."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - name: Generate and email report
        if: steps.gate.outputs.go == 'true'
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # schedule = the delayed backup path; mark its subject so a late one
          # is obviously the fallback (the on-time path failed that day).
          RUN_MODE: ${{ github.event_name == 'schedule' && 'fallback' || 'primary' }}
        run: |
          python3 morning-agent/sl_morning_agent.py > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Archive as issue
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          gh issue list --repo "${{ github.repository }}" \
            --search "SL morning report in:title" --state open \
            --json number --jq '.[].number' \
            | while read -r x; do gh issue close "$x" --repo "${{ github.repository }}" || true; done
          gh issue create --repo "${{ github.repository }}" \
            --title "$REPORT_TITLE" --assignee "$OWNER" --body-file report.md
