name: SL morning agent

on:
  schedule:
    # GitHub delays scheduled runs by 2-7 hours on free accounts, so we
    # spread triggers across the whole likely-delivery window and use a
    # workflow-level dedup check to send the report exactly once per day.
    # The script also sends email directly via Gmail so no GitHub
    # notification settings are needed.
    #
    # CEST (summer, UTC+2): 06:00 = 04:00 UTC
    # CET  (winter, UTC+1): 06:00 = 05:00 UTC
    - cron: "0 3 * * *"    # 05:00 CEST
    - cron: "30 3 * * *"   # 05:30 CEST
    - cron: "0 4 * * *"    # 06:00 CEST / 05:00 CET
    - cron: "30 4 * * *"   # 06:30 CEST / 05:30 CET
    - cron: "0 5 * * *"    # 07:00 CEST / 06:00 CET
    - cron: "30 5 * * *"   # 07:30 CEST / 06:30 CET
    - cron: "0 6 * * *"    # 08:00 CEST / 07:00 CET  (late fallback)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  morning-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check if already sent today
        id: dedup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="🚆 SL morning report $(TZ=Europe/Stockholm date +%F)"
          echo "REPORT_TITLE=$TITLE" >> "$GITHUB_ENV"
          # Manual runs always proceed; scheduled runs skip if report exists.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "already_sent=false" >> "$GITHUB_OUTPUT"
          else
            count=$(gh issue list \
              --repo "${{ github.repository }}" \
              --search "\"$TITLE\" in:title" \
              --state all --json number --jq 'length')
            if [ "$count" != "0" ]; then
              echo "Today's report already sent — skipping."
              echo "already_sent=true" >> "$GITHUB_OUTPUT"
            else
              echo "already_sent=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Generate and email report
        if: steps.dedup.outputs.already_sent == 'false'
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 morning-agent/sl_morning_agent.py > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Archive report as GitHub issue
        if: steps.dedup.outputs.already_sent == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # Close older open reports so only today's stays open.
          gh issue list \
            --repo "${{ github.repository }}" \
            --search "SL morning report in:title" \
            --state open --json number --jq '.[].number' \
            | while read -r n; do
                gh issue close "$n" --repo "${{ github.repository }}" || true
              done
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "$REPORT_TITLE" \
            --assignee "$OWNER" \
            --body-file report.md
